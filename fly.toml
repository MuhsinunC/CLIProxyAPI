# fly.toml - Fly.io deployment configuration
app = "cliproxyapi-dev"
primary_region = "iad"  # US East (closest to Anthropic/OpenAI APIs)

[build]
  dockerfile = "Dockerfile.fly"

[env]
  TZ = "America/New_York"
  GIN_MODE = "release"

[mounts]
  source = "cliproxy_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8317
  force_https = true
  auto_stop_machines = false   # Keep running 24/7
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
